<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - Mercado Libre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="index.html">
                <img src="https://http2.mlstatic.com/frontend-assets/ml-web-navigation/ui-navigation/logo__large_v2.png" alt="Mercado Libre" class="logo">
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Buscar productos, marcas y más...">
                <button>🔍</button>
            </div>
        </div>
    </header>
    
    <main class="container detail-container">
        <div id="product-detail" class="detail-card">
            <!-- Product details will be loaded here -->
            <p>Cargando producto...</p>
        </div>
        <a href="index.html" class="back-link">← Volver al listado</a>
    </main>

    <script src="detail.js"></script>
</body>
</html>
